[build]
  base = "."
  command = "rm -rf package-lock.json node_modules && npm install && npm run build --workspace=client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"