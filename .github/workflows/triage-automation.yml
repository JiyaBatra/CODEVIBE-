name: 'Triage Automation'

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Labeling
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue || context.payload.pull_request).title.toLowerCase();
            const labels = [];
            if (title.includes('bug') || title.includes('fix')) labels.push('bug');
            if (title.includes('feat') || title.includes('add')) labels.push('enhancement');
            if (title.includes('docs') || title.includes('readme')) labels.push('documentation');
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: (context.payload.issue || context.payload.pull_request).number,
                labels: labels
              });
            }
